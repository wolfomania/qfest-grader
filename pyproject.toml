[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qfest-grader"
version = "0.2.0"
description = "Grader client for the Qiskit Fall Fest 2026 Warsaw lab notebooks"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "qiskit>=1.0",
    "requests>=2.25",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# Libraries some lab grade functions import when they run; the tests use them when present.
labs = ["qiskit-ibm-runtime>=0.40", "samplomatic>=0.20"]

[project.urls]
Source = "https://github.com/wolfomania/qfest-grader"

[tool.setuptools.packages.find]
include = ["qfest_grader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
